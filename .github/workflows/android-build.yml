name: Android CI - Build Beatly APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Beatly Android APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Generate Release Keystore
      run: |
        keytool -genkeypair -v -keystore keystore.jks -alias beatly -keyalg RSA -keysize 2048 -validity 10000 -storepass beatlymusic -keypass beatlymusic -dname "CN=Beatly, OU=Beatly, O=Beatly, L=NY, S=NY, C=US"

    - name: Build Universal Release APK
      env:
        STORE_PASSWORD: beatlymusic
        KEY_ALIAS: beatly
        KEY_PASSWORD: beatlymusic
      run: |
        chmod +x gradlew
        ./gradlew assembleUniversalFossRelease --stacktrace

    - name: Upload Beatly APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Beatly-Release-APK
        path: app/build/outputs/apk/**/*.apk
        if-no-files-found: error
