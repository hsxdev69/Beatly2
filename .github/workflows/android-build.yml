name: Android CI - Build Echo Music APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Echo Music Android APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Generate Release Keystore
      run: |
        keytool -genkeypair -v -keystore keystore.jks -alias echo -keyalg RSA -keysize 2048 -validity 10000 -storepass echomusic -keypass echomusic -dname "CN=Echo, OU=Echo, O=Echo, L=NY, S=NY, C=US"

    - name: Build Universal Release APK
      env:
        STORE_PASSWORD: echomusic
        KEY_ALIAS: echo
        KEY_PASSWORD: echomusic
      run: |
        chmod +x gradlew
        ./gradlew assembleUniversalFossRelease --stacktrace

    - name: Upload Echo Music APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Echo-Music-Kotlin-Release-APK
        path: app/build/outputs/apk/**/*.apk
        if-no-files-found: error
